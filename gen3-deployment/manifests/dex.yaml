# One Dex instance with SQLite on local-path storage.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dex-data
  namespace: dex
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: csi-cinder-sc-delete
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: dex
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dex
        image: ghcr.io/dexidp/dex:v2.44.0
        args:
        - dex
        - serve
        - /config/config.yaml
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 5556
        readinessProbe:
          httpGet:
            path: /dex/healthz
            port: http
        livenessProbe:
          httpGet:
            path: /dex/healthz
            port: http
          initialDelaySeconds: 30
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: data
          mountPath: /data
      volumes:
      - name: config
        secret:
          secretName: dex-config
          defaultMode: 288
      - name: data
        persistentVolumeClaim:
          claimName: dex-data
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: dex
spec:
  selector:
    app: dex
  ports:
  - name: http
    port: 5556
    targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dex
  namespace: dex
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`gen3.kind.test`) && PathPrefix(`/dex`)
    kind: Rule
    priority: 200
    services:
    - name: dex
      port: 5556
