# Generic Tube ETL mapping reference.
# This file shows the values an ETL mapping can contain; replace the example
# names and paths with nodes and properties from your data model.
etlMapping:
  mappings:
    - name: my-data-commons_subject
      doc_type: subject
      type: aggregator # aggregator or collector
      root: subject

      props:
        - name: submitter_id
        - name: <property from root>

    - name: my-data-commons_file
      doc_type: file
      type: collector
      root: None
      category: data_file
      props:
        - name: object_id
        - name: file_name
