<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1215" viewBox="0 0 2160 1215">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1b2a"/><stop offset="1" stop-color="#123b5d"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14344d" flood-opacity="0.18"/>
    </filter>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .navy { fill: #0d3154; }
      .muted { fill: #536b7c; }
      .node { stroke-width: 3; }
      .connector { fill: none; stroke: #718493; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="2160" height="1215" fill="#f5f8fa"/>
  <rect width="2160" height="154" fill="url(#header)"/>
  <text x="86" y="79" class="sans" fill="#ffffff" font-size="52" font-weight="700">ETL · Example Data Model</text>
  <text x="88" y="119" class="sans" fill="#b8d4e5" font-size="22">A graph of related GEN3 entities, from program context to searchable data files</text>
  <text x="2010" y="83" class="sans" fill="#ffffff" font-size="49" font-weight="700">GEN</text>
  <text x="2058" y="121" class="sans" fill="#54a7dc" font-size="43" font-weight="700">3</text>

  <!-- Legend -->
  <g filter="url(#shadow)">
    <rect x="75" y="230" width="285" height="460" rx="18" fill="#ffffff" stroke="#c7d6e0" stroke-width="2"/>
  </g>
  <text x="112" y="282" class="sans navy" font-size="29" font-weight="700">Node type</text>
  <text x="112" y="316" class="sans muted" font-size="18">Categories used by the data model</text>
  <rect x="112" y="355" width="210" height="66" rx="10" fill="#c9def0" stroke="#78a9ca" class="node"/>
  <text x="217" y="397" text-anchor="middle" class="sans navy" font-size="24" font-weight="700">admin</text>
  <rect x="112" y="447" width="210" height="66" rx="10" fill="#f9e2c7" stroke="#e5ad72" class="node"/>
  <text x="217" y="489" text-anchor="middle" class="sans navy" font-size="24" font-weight="700">subject</text>
  <rect x="112" y="539" width="210" height="66" rx="10" fill="#f3c9cc" stroke="#dd858d" class="node"/>
  <text x="217" y="581" text-anchor="middle" class="sans navy" font-size="24" font-weight="700">data_file</text>
  <text x="112" y="647" class="sans muted" font-size="17">Color shows the role of each node.</text>

  <!-- Connectors behind nodes -->
  <g class="connector">
    <path d="M620 397 H760"/>
    <path d="M945 397 C1030 397 1030 493 1085 493"/>
    <path d="M1178 542 V665"/>
    <path d="M1178 738 C1178 788 568 788 568 846"/>
    <path d="M1178 738 C1178 788 858 788 858 846"/>
    <path d="M1178 738 C1178 788 1208 788 1208 846"/>
    <path d="M1178 738 C1178 788 1710 788 1710 846"/>
    <path d="M1710 930 C1710 970 1575 970 1575 1014"/>
    <path d="M1710 930 C1710 970 1845 970 1845 1014"/>
  </g>

  <!-- Graph labels -->
  <text x="690" y="373" class="sans muted" font-size="17">contains</text>
  <text x="1005" y="429" class="sans muted" font-size="17">contains</text>
  <text x="1203" y="626" class="sans muted" font-size="17">has</text>
  <text x="681" y="818" class="sans muted" font-size="17">has</text>
  <text x="1000" y="818" class="sans muted" font-size="17">has</text>
  <text x="1330" y="818" class="sans muted" font-size="17">has</text>
  <text x="1750" y="978" class="sans muted" font-size="17">contains</text>

  <!-- Nodes -->
  <g filter="url(#shadow)">
    <rect x="430" y="345" width="190" height="104" rx="12" fill="#c9def0" stroke="#78a9ca" class="node"/>
    <rect x="760" y="345" width="185" height="104" rx="12" fill="#c9def0" stroke="#78a9ca" class="node"/>
    <rect x="1085" y="442" width="185" height="104" rx="12" fill="#f9e2c7" stroke="#e5ad72" class="node"/>
    <rect x="1085" y="665" width="185" height="104" rx="12" fill="#f9e2c7" stroke="#e5ad72" class="node"/>

    <rect x="475" y="846" width="185" height="104" rx="12" fill="#f9e2c7" stroke="#e5ad72" class="node"/>
    <rect x="765" y="846" width="185" height="104" rx="12" fill="#f9e2c7" stroke="#e5ad72" class="node"/>
    <rect x="1115" y="846" width="185" height="104" rx="12" fill="#f9e2c7" stroke="#e5ad72" class="node"/>
    <rect x="1617" y="846" width="185" height="104" rx="12" fill="#f9e2c7" stroke="#e5ad72" class="node"/>

    <rect x="1480" y="1014" width="190" height="104" rx="12" fill="#f3c9cc" stroke="#dd858d" class="node"/>
    <rect x="1750" y="1014" width="190" height="104" rx="12" fill="#f3c9cc" stroke="#dd858d" class="node"/>
  </g>

  <g class="sans navy" text-anchor="middle">
    <text x="525" y="407" font-size="27" font-weight="700">Program</text>
    <text x="852" y="407" font-size="27" font-weight="700">Project</text>
    <text x="1177" y="504" font-size="27" font-weight="700">Study</text>
    <text x="1177" y="727" font-size="27" font-weight="700">Subject</text>
    <text x="567" y="908" font-size="26" font-weight="700">Treatment</text>
    <text x="857" y="908" font-size="26" font-weight="700">Events</text>
    <text x="1207" y="908" font-size="25" font-weight="700">Demographics</text>
    <text x="1709" y="908" font-size="26" font-weight="700">Sample</text>
    <text x="1575" y="1060" font-size="24" font-weight="700"><tspan x="1575" dy="0">Data file ·</tspan><tspan x="1575" dy="29">image</tspan></text>
    <text x="1845" y="1060" font-size="24" font-weight="700"><tspan x="1845" dy="0">Data file ·</tspan><tspan x="1845" dy="29">assay</tspan></text>
  </g>

  <rect x="430" y="1150" width="1510" height="3" fill="#d5e0e6"/>
  <text x="1185" y="1190" text-anchor="middle" class="sans muted" font-size="20">Administrative context → subject-level records → files collected for analysis</text>
</svg>