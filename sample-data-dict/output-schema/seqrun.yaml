$schema: http://json-schema.org/draft-04/schema#
id: seqrun
title: seqrun
type: object
namespace: https://link-to-data-portal/
category: data_file
program: '*'
project: '*'
description: Sequencing run node
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- exclusive: false
  required: true
  subgroup:
  - name: dnas
    backref: seqruns
    label: part_of
    target_type: dna
    multiplicity: one_to_many
    required: true
  - name: core_metadata_collections
    backref: seqruns
    label: part_of
    target_type: core_metadata_collection
    multiplicity: one_to_one
    required: false
properties:
  $ref: _definitions.yaml#/data_file_properties
  seqrun_id:
    type: string
    description: The sequencing run ID.
  dna_id:
    type: string
    description: The DNA ID.
  dnas:
    $ref: _definitions.yaml#/to_many
  core_metadata_collections:
    $ref: _definitions.yaml#/to_one
  data_category:
    description: Broad categorization of the contents of the data file.
    enum:
    - data_category_1
    - data_category_2
    - data_category_3
  data_format:
    description: The format of the data in this data file
    enum:
    - data_format_1
    - data_format_2
    - data_format_3
  data_type:
    description: The type of data in this data file
    enum:
    - data_type_1
    - data_type_2
    - data_type_3
additionalProperties: false
